schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
description: |
  Encrypt existing unencrypted EBS volumes attached to an EC2 instance. Creates safety snapshots, creates encrypted replacement volumes, preserves tags and DeleteOnTermination, and swaps volumes during downtime. All long-running waits use native SSM Automation wait actions.
parameters:
  AutomationAssumeRole:
    type: String
    description: ARN of the IAM role (trusted by ssm.amazonaws.com) that Automation assumes.
  InstanceId:
    type: String
    description: EC2 instance ID
  KmsKeyId:
    type: String
    description: |
      KMS key ID, ARN, or alias to use for EBS encryption. Leave empty to use the account default EBS KMS key.
    default: ''
  DryRun:
    type: Boolean
    description: |
      If true, only reports unencrypted volumes. No snapshot, volume, detach, attach, or instance-state changes are made.
    default: true
  SnapshotTimeoutSeconds:
    type: Integer
    description: Maximum time to wait for a snapshot operation
    default: 7200
  VolumeTimeoutSeconds:
    type: Integer
    description: Maximum time to wait for a volume state transition
    default: 7200
  InstanceTimeoutSeconds:
    type: Integer
    description: Maximum time to wait for EC2 state transitions
    default: 3600
mainSteps:
  - name: DiscoverVolumes
    action: aws:executeScript
    timeoutSeconds: 60
    nextStep: CheckDryRun
    isEnd: false
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      Script: |-

        import boto3

        def handler(events, context):

            ec2 = boto3.client("ec2")

            instance_id = events["InstanceId"]

            response = ec2.describe_instances(
                InstanceIds=[instance_id]
            )

            instance = response["Reservations"][0]["Instances"][0]

            instance_state = instance["State"]["Name"]

            mappings = instance.get("BlockDeviceMappings", [])

            volume_ids = []

            for mapping in mappings:

                ebs = mapping.get("Ebs")

                if not ebs:
                    continue

                volume_id = ebs.get("VolumeId")

                if volume_id:
                    volume_ids.append(volume_id)

            if not volume_ids:

                return {
                    "OriginalState": instance_state,
                    "NeedsEncryption": False,
                    "VolumeIds": [],
                    "Report": "No EBS volumes were found."
                }

            volumes_response = ec2.describe_volumes(
                VolumeIds=volume_ids
            )

            unencrypted = []

            report_lines = []

            for volume in volumes_response["Volumes"]:

                volume_id = volume["VolumeId"]
                encrypted = volume.get("Encrypted", False)
                volume_type = volume.get("VolumeType")
                size = volume.get("Size")
                az = volume.get("AvailabilityZone")

                status = "ENCRYPTED" if encrypted else "UNENCRYPTED"

                report_lines.append(
                    f"{volume_id} | {status} | "
                    f"{volume_type} | {size} GiB | {az}"
                )

                if not encrypted:
                    unencrypted.append(volume_id)

            report = "\n".join(report_lines)

            return {
                "OriginalState": instance_state,
                "NeedsEncryption": len(unencrypted) > 0,
                "VolumeIds": unencrypted,
                "Report": report
            }
      InputPayload:
        InstanceId: '{{ InstanceId }}'
    outputs:
      - Name: OriginalState
        Selector: $.Payload.OriginalState
        Type: String
      - Name: NeedsEncryption
        Selector: $.Payload.NeedsEncryption
        Type: Boolean
      - Name: VolumeIds
        Selector: $.Payload.VolumeIds
        Type: StringList
      - Name: Report
        Selector: $.Payload.Report
        Type: String
  - name: CheckDryRun
    action: aws:branch
    inputs:
      Choices:
        - NextStep: DryRunComplete
          Variable: '{{ DryRun }}'
          BooleanEquals: true
      Default: CheckNeedsEncryption
  - name: DryRunComplete
    action: aws:executeScript
    timeoutSeconds: 30
    isEnd: true
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      Script: |-

        def handler(events, context):

            report = events.get("Report", "")

            return {
                "Message":
                    "DRY RUN - No changes were made.\n\n"
                    + report
            }
      InputPayload:
        Report: '{{ DiscoverVolumes.Report }}'
    outputs:
      - Name: Message
        Selector: $.Payload.Message
        Type: String
  - name: CheckNeedsEncryption
    action: aws:branch
    inputs:
      Choices:
        - NextStep: StopInstance
          Variable: '{{ DiscoverVolumes.NeedsEncryption }}'
          BooleanEquals: true
      Default: NothingToDo
  - name: NothingToDo
    action: aws:executeScript
    timeoutSeconds: 30
    isEnd: true
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      Script: |-

        def handler(events, context):

            return {
                "Message": "All attached EBS volumes are already encrypted."
            }
      InputPayload: {}
    outputs:
      - Name: Message
        Selector: $.Payload.Message
        Type: String
  - name: StopInstance
    action: aws:changeInstanceState
    maxAttempts: 2
    timeoutSeconds: 3600
    nextStep: ProcessVolumes
    isEnd: false
    onFailure: Abort
    inputs:
      InstanceIds:
        - '{{ InstanceId }}'
      DesiredState: stopped
      CheckStateOnly: false
      Force: false
  - name: ProcessVolumes
    action: aws:loop
    nextStep: RestoreOriginalInstanceState
    isEnd: false
    onFailure: Abort
    inputs:
      Iterators: '{{ DiscoverVolumes.VolumeIds }}'
      IteratorDataType: String
      MaxIterations: 100
      Steps:
        - name: GetVolumeContext
          action: aws:executeScript
          timeoutSeconds: 60
          nextStep: CreateSafetySnapshot
          isEnd: false
          onFailure: Abort
          inputs:
            Runtime: python3.11
            Handler: handler
            Script: |-

              import boto3

              def handler(events, context):

                  ec2 = boto3.client("ec2")

                  instance_id = events["InstanceId"]
                  volume_id = events["VolumeId"]

                  volume_response = ec2.describe_volumes(
                      VolumeIds=[volume_id]
                  )

                  volume = volume_response["Volumes"][0]

                  instance_response = ec2.describe_instances(
                      InstanceIds=[instance_id]
                  )

                  instance = instance_response[
                      "Reservations"
                  ][0]["Instances"][0]

                  device = None
                  delete_on_termination = False

                  for mapping in instance.get(
                      "BlockDeviceMappings", []
                  ):

                      ebs = mapping.get("Ebs")

                      if ebs and ebs.get("VolumeId") == volume_id:

                          device = mapping["DeviceName"]

                          delete_on_termination = ebs.get(
                              "DeleteOnTermination",
                              False
                          )

                          break

                  if not device:

                      raise Exception(
                          f"Volume {volume_id} is not attached "
                          f"to instance {instance_id}"
                      )

                  return {
                      "VolumeId": volume_id,
                      "Device": device,
                      "DeleteOnTermination":
                          delete_on_termination,
                      "VolumeType":
                          volume.get("VolumeType"),
                      "Size":
                          volume.get("Size"),
                      "Iops":
                          volume.get("Iops", 0),
                      "Throughput":
                          volume.get("Throughput", 0),
                      "AvailabilityZone":
                          volume.get("AvailabilityZone")
                  }
            InputPayload:
              InstanceId: '{{ InstanceId }}'
              VolumeId: '{{ ProcessVolumes.CurrentIteratorValue }}'
          outputs:
            - Name: VolumeId
              Selector: $.Payload.VolumeId
              Type: String
            - Name: Device
              Selector: $.Payload.Device
              Type: String
            - Name: DeleteOnTermination
              Selector: $.Payload.DeleteOnTermination
              Type: Boolean
            - Name: VolumeType
              Selector: $.Payload.VolumeType
              Type: String
            - Name: Size
              Selector: $.Payload.Size
              Type: Integer
            - Name: Iops
              Selector: $.Payload.Iops
              Type: Integer
            - Name: Throughput
              Selector: $.Payload.Throughput
              Type: Integer
            - Name: AvailabilityZone
              Selector: $.Payload.AvailabilityZone
              Type: String
        - name: CreateSafetySnapshot
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: WaitForSafetySnapshot
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: CreateSnapshot
            VolumeId: '{{ GetVolumeContext.VolumeId }}'
            Description: EBS encryption safety snapshot - {{ GetVolumeContext.VolumeId }}
          outputs:
            - Name: SnapshotId
              Selector: $.SnapshotId
              Type: String
        - name: WaitForSafetySnapshot
          action: aws:waitForAwsResourceProperty
          timeoutSeconds: 7200
          nextStep: CreateEncryptedSnapshot
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeSnapshots
            SnapshotIds:
              - '{{ CreateSafetySnapshot.SnapshotId }}'
            PropertySelector: $.Snapshots[0].State
            DesiredValues:
              - completed
        - name: CreateEncryptedSnapshot
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: WaitForEncryptedSnapshot
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: CopySnapshot
            SourceRegion: '{{ global:REGION }}'
            SourceSnapshotId: '{{ CreateSafetySnapshot.SnapshotId }}'
            Encrypted: true
            Description: Encrypted EBS snapshot for {{ GetVolumeContext.VolumeId }}
          outputs:
            - Name: EncryptedSnapshotId
              Selector: $.SnapshotId
              Type: String
        - name: WaitForEncryptedSnapshot
          action: aws:waitForAwsResourceProperty
          timeoutSeconds: 7200
          nextStep: CreateEncryptedVolume
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeSnapshots
            SnapshotIds:
              - '{{ CreateEncryptedSnapshot.EncryptedSnapshotId }}'
            PropertySelector: $.Snapshots[0].State
            DesiredValues:
              - completed
        - name: CreateEncryptedVolume
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: WaitForEncryptedVolume
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: CreateVolume
            AvailabilityZone: '{{ GetVolumeContext.AvailabilityZone }}'
            SnapshotId: '{{ CreateEncryptedSnapshot.EncryptedSnapshotId }}'
            Encrypted: true
            VolumeType: '{{ GetVolumeContext.VolumeType }}'
            Iops: '{{ GetVolumeContext.Iops }}'
            Throughput: '{{ GetVolumeContext.Throughput }}'
          outputs:
            - Name: NewVolumeId
              Selector: $.VolumeId
              Type: String
        - name: WaitForEncryptedVolume
          action: aws:waitForAwsResourceProperty
          timeoutSeconds: 7200
          nextStep: CopyVolumeTags
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeVolumes
            VolumeIds:
              - '{{ CreateEncryptedVolume.NewVolumeId }}'
            PropertySelector: $.Volumes[0].State
            DesiredValues:
              - available
        - name: CopyVolumeTags
          action: aws:executeScript
          timeoutSeconds: 60
          nextStep: DetachOriginalVolume
          isEnd: false
          onFailure: Abort
          inputs:
            Runtime: python3.11
            Handler: handler
            Script: |-

              import boto3

              def handler(events, context):

                  ec2 = boto3.client("ec2")

                  original = events["OriginalVolume"]
                  new_volume = events["NewVolume"]
                  safety_snapshot = events["SafetySnapshot"]

                  response = ec2.describe_volumes(
                      VolumeIds=[original]
                  )

                  tags = response["Volumes"][0].get(
                      "Tags",
                      []
                  )

                  new_tags = []

                  for tag in tags:

                      key = tag.get("Key")

                      # EC2 rejects reserved AWS tags and our management tags.
                      if key and not key.startswith("aws:") and key not in [
                          "EBS-Encryption-OriginalVolume",
                          "EBS-Encryption-SafetySnapshot",
                          "EBS-Encryption-ReplacementVolume"
                      ]:

                          new_tags.append({
                              "Key": key,
                              "Value": tag.get("Value", "")
                          })

                  new_tags.extend([
                      {
                          "Key": "EBS-Encryption-OriginalVolume",
                          "Value": original
                      },
                      {
                          "Key": "EBS-Encryption-SafetySnapshot",
                          "Value": safety_snapshot
                      },
                      {
                          "Key": "EBS-Encryption-ReplacementVolume",
                          "Value": new_volume
                      }
                  ])

                  ec2.create_tags(
                      Resources=[new_volume],
                      Tags=new_tags
                  )

                  ec2.create_tags(
                      Resources=[original],
                      Tags=[
                          {
                              "Key": "EBS-Encryption-ReplacementVolume",
                              "Value": new_volume
                          },
                          {
                              "Key": "EBS-Encryption-SafetySnapshot",
                              "Value": safety_snapshot
                          }
                      ]
                  )

                  return {
                      "Status": "Tags copied successfully"
                  }
            InputPayload:
              OriginalVolume: '{{ GetVolumeContext.VolumeId }}'
              NewVolume: '{{ CreateEncryptedVolume.NewVolumeId }}'
              SafetySnapshot: '{{ CreateSafetySnapshot.SnapshotId }}'
        - name: DetachOriginalVolume
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: WaitForOriginalDetached
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DetachVolume
            VolumeId: '{{ GetVolumeContext.VolumeId }}'
            InstanceId: '{{ InstanceId }}'
            Force: false
        - name: WaitForOriginalDetached
          action: aws:waitForAwsResourceProperty
          timeoutSeconds: 3600
          nextStep: AttachEncryptedVolume
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeVolumes
            VolumeIds:
              - '{{ GetVolumeContext.VolumeId }}'
            PropertySelector: $.Volumes[0].State
            DesiredValues:
              - available
        - name: AttachEncryptedVolume
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: WaitForEncryptedAttached
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: AttachVolume
            VolumeId: '{{ CreateEncryptedVolume.NewVolumeId }}'
            InstanceId: '{{ InstanceId }}'
            Device: '{{ GetVolumeContext.Device }}'
        - name: WaitForEncryptedAttached
          action: aws:waitForAwsResourceProperty
          timeoutSeconds: 3600
          nextStep: ValidateEncryption
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeVolumes
            VolumeIds:
              - '{{ CreateEncryptedVolume.NewVolumeId }}'
            PropertySelector: $.Volumes[0].State
            DesiredValues:
              - in-use
        - name: ValidateEncryption
          action: aws:assertAwsResourceProperty
          timeoutSeconds: 60
          nextStep: RestoreDeleteOnTermination
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: DescribeVolumes
            VolumeIds:
              - '{{ CreateEncryptedVolume.NewVolumeId }}'
            PropertySelector: $.Volumes[0].Encrypted
            DesiredValues:
              - 'True'
        - name: RestoreDeleteOnTermination
          action: aws:executeAwsApi
          maxAttempts: 3
          timeoutSeconds: 30
          nextStep: FinalVolumeValidation
          isEnd: false
          onFailure: Abort
          inputs:
            Service: ec2
            Api: ModifyInstanceAttribute
            InstanceId: '{{ InstanceId }}'
            BlockDeviceMappings:
              - DeviceName: '{{ GetVolumeContext.Device }}'
                Ebs:
                  DeleteOnTermination: '{{ GetVolumeContext.DeleteOnTermination }}'
        - name: FinalVolumeValidation
          action: aws:executeScript
          timeoutSeconds: 60
          isEnd: true
          onFailure: Abort
          inputs:
            Runtime: python3.11
            Handler: handler
            Script: |-

              import boto3

              def handler(events, context):

                  ec2 = boto3.client("ec2")

                  instance_id = events["InstanceId"]
                  volume_id = events["VolumeId"]
                  device = events["Device"]

                  instance_response = ec2.describe_instances(
                      InstanceIds=[instance_id]
                  )

                  instance = instance_response[
                      "Reservations"
                  ][0]["Instances"][0]

                  found = False

                  for mapping in instance.get(
                      "BlockDeviceMappings", []
                  ):

                      ebs = mapping.get("Ebs")

                      if not ebs:
                          continue

                      if (
                          mapping.get("DeviceName") == device
                          and
                          ebs.get("VolumeId") == volume_id
                      ):
                          found = True
                          break

                  volume_response = ec2.describe_volumes(
                      VolumeIds=[volume_id]
                  )

                  volume = volume_response["Volumes"][0]

                  if not volume.get("Encrypted"):
                      raise Exception(
                          f"Volume {volume_id} is not encrypted"
                      )

                  if not found:
                      raise Exception(
                          f"Volume {volume_id} is not attached "
                          f"to {device}"
                      )

                  return {
                      "Status": "SUCCESS",
                      "VolumeId": volume_id,
                      "Device": device,
                      "Encrypted": True
                  }
            InputPayload:
              InstanceId: '{{ InstanceId }}'
              VolumeId: '{{ CreateEncryptedVolume.NewVolumeId }}'
              Device: '{{ GetVolumeContext.Device }}'
          outputs:
            - Name: Status
              Selector: $.Payload.Status
              Type: String
  - name: RestoreOriginalInstanceState
    action: aws:branch
    inputs:
      Choices:
        - NextStep: StartInstance
          Variable: '{{ DiscoverVolumes.OriginalState }}'
          StringEquals: running
      Default: EncryptionComplete
  - name: StartInstance
    action: aws:changeInstanceState
    maxAttempts: 2
    timeoutSeconds: 3600
    nextStep: EncryptionComplete
    isEnd: false
    onFailure: Abort
    inputs:
      InstanceIds:
        - '{{ InstanceId }}'
      DesiredState: running
      CheckStateOnly: false
      FailOnUnexpectedStopped: true
  - name: EncryptionComplete
    action: aws:executeScript
    timeoutSeconds: 30
    isEnd: true
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      Script: |-

        def handler(events, context):

            return {
                "Message":
                    "EBS encryption replacement completed successfully. "
                    "Original volumes and safety snapshots were retained "
                    "for rollback/recovery."
            }
      InputPayload: {}
    outputs:
      - Name: Message
        Selector: $.Payload.Message
        Type: String
